# -----------------------------------------------------------------------------------
# ⚙️ APPLICATION SETTINGS (The Control Panel)
# This file tells the application HOW to run.
# It defines where the database is, what language to speak, and where to find secrets.
# -----------------------------------------------------------------------------------

# ===================================================================================
# 📦 DATABASE CONFIGURATION (The New DigitalOcean Server!)
# ===================================================================================

# 1. The Address (URL)
# We are now connecting to our self-hosted Docker container on DigitalOcean!
# "jdbc:postgresql" tells Java: "We are talking to a Postgres database."
spring.datasource.url=jdbc:postgresql://206.189.57.159:5432/atomic_ledger

# 2. The Username (The Gatekeeper)
# This matches the POSTGRES_USER we explicitly set in our docker-compose.yml
spring.datasource.username=atomic_admin

# 3. The Password (THE SECRET) 🛑
# NOTICE: We do NOT type the real password here!
# "${DB_PASSWORD}" tells Spring Boot:
# "Go look in the Computer's Environment Variables (The Safe) for a key named DB_PASSWORD."
spring.datasource.password=${DB_PASSWORD}

# ===================================================================================
# 🏗️ HIBERNATE SETTINGS (The Construction Crew)
# Hibernate is the tool that translates Java code into Database Tables.
# ===================================================================================

# "update" means: "If I add a new field (like 'category') in Java,
# automatically update the database table to match." (Don't delete old data).
spring.jpa.hibernate.ddl-auto=update

# This tells Hibernate to speak the specific "Dialect" of PostgreSQL
# (so it doesn't try to speak MySQL or Oracle).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# "true" means: "Print every SQL command to the console."
# It acts like a security camera showing us exactly what the database is doing.
spring.jpa.show-sql=true

# ===================================================================================
# 🧠 GOOGLE GEMINI API (The AI Brain)
# ===================================================================================

# 1. The API Key (The ID Card) 🛑
# Again, we use "${...}" to hide the key in the Environment Variables.
# If we put the real key here and uploaded it to GitHub, hackers would steal it!
gemini.api.key=${GEMINI_API_KEY}

# 2. The URL (The Phone Number)
# This is the web address we call to reach Google's servers.
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=